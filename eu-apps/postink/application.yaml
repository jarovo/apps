apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postink
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/jarovo/postink/charts/postink
    path: .
    targetRevision: 0.1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: postink
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
