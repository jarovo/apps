apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: postink
  namespace: argocd
spec:
  writeBackConfig:
    method: git
    gitConfig:
      writeBackTarget: "helmvalues"
  applicationRefs:
    - namePattern: "postink"
      images:
        - alias: "postink"
          imageName: "docker.io/jaryh3/postink:~0.1"