apiVersion: batch/v1
kind: Job
metadata:
  name: test-job
  generateName: test
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: test
          image: busybox
          command:
            - nc
            - -zv
            - postink.postink.svc.cluster.local
            - "25"
      restartPolicy: Never
  backoffLimit: 2