apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: self
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jarovo/apps.git
    targetRevision: HEAD
    path: self
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://opensearch-project.github.io/helm-charts/
    chart: opensearch
    targetRevision: 3.8.0
    helm:
      valuesObject:
        singleNode: true
        opensearchJavaOpts: "-Xmx128M -Xms128M"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        initResources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        sidecarResources:
          requests:
            cpu: "100m"
            memory: "128Mi"
  destination:
    server: https://kubernetes.default.svc
    namespace: opensearch
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://opensearch-project.github.io/helm-charts/
    chart: opensearch-dashboards
    targetRevision: 3.8.0
    helm:
      valuesObject: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: opensearch-dashboards
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts/
    chart: fluent-operator
    targetRevision: 4.3.0
  destination:
    server: https://kubernetes.default.svc
    namespace: fluent-operator
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
